name: Runtime security checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build and check runtimes, trust stores, tracker, signer and migrations
        run: python3 tests/security.py
