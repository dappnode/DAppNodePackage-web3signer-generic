version: "3.8"
services:
  brain:
    build:
      context: services/brain
      args:
        BRAIN_VERSION: 0.2.0
    environment:
      - LOG_LEVEL=debug
    restart: unless-stopped
    volumes:
      - brain_data:/app/data
  web3signer:
    depends_on:
      flyway:
        condition: service_completed_successfully
      # Stops web3signer before postgres: it exports the slashing protection database when it stops
      postgres:
        condition: service_started
    # Web3Signer shutdown + slashing protection export, a few seconds even for large databases
    stop_grace_period: 2m
    security_opt:
      - seccomp:unconfined
    build:
      context: services/web3signer
      args:
        WEB3SIGNER_VERSION: 26.11.0
        STAKER_SCRIPTS_VERSION: v0.1.2
        POSTGRES_USER: postgres
    environment:
      JAVA_OPTS: "-Xmx6g"
      EXTRA_OPTS: ""
      EXTRA_HOST_ALLOWLIST: ""
      WEB3SIGNER_VERTX_WORKER_POOL_SIZE: "20"
    volumes:
      - web3signer_data:/data
    restart: unless-stopped
  flyway:
    build:
      context: services/flyway
      args:
        WEB3SIGNER_VERSION: 26.11.0
        POSTGRES_USER: postgres
    depends_on:
      postgres:
        condition: service_started
    restart: on-failure
  postgres:
    build:
      context: services/postgres
      args:
        WEB3SIGNER_VERSION: 26.11.0
        DATA_DIR: /var/lib/postgresql/data
        POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres
      interval: 5s
      timeout: 5s
      retries: 5
    user: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
  tracker:
    build:
      context: services/tracker
      args:
        TRACKER_VERSION: 0.1.5
    restart: unless-stopped
volumes:
  brain_data: {}
  web3signer_data: {}
  postgres_data: {}
