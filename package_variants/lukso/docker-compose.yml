version: "3.8"
services:
  brain:
    build:
      args:
        NETWORK: lukso

  web3signer:
    build:
      args:
        NETWORK: lukso
        PGPASSWORD: password
        POSTGRES_DB: web3signer
    healthcheck:
      test: >-
        curl -H 'Host: web3signer.web3signer-lukso.dappnode'
        http://localhost:9000/healthcheck
      interval: 5s
      timeout: 5s
      retries: 100

  flyway:
    build:
      args:
        NETWORK: lukso
        PGPASSWORD: password
        POSTGRES_DB: web3signer

  postgres:
    build:
      dockerfile: Dockerfile.debian
      args:
        POSTGRES_PASSWORD: password
        PGPASSWORD: password
        POSTGRES_DB: web3signer
    # PostgreSQL 18 layout: the cluster lives in /var/lib/postgresql/18/docker inside the volume.
    # A PostgreSQL 14 cluster from older package versions sits at the volume root and is
    # upgraded on start by upgrade-from-14.sh.
    volumes:
      - postgres_data:/var/lib/postgresql

  tracker:
    build:
      args:
        NETWORK: lukso
